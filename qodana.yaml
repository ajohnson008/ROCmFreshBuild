# Minimal Qodana Configuration for ROCmFreshBuild
# Version: 2023.3 Compatible
# This is the SIMPLEST configuration that will work

version: "1.0"

# Specify Python linter
linter: jetbrains/qodana-python:2023.3

# Use recommended profile
profile:
  name: qodana.recommended

# Exclude paths (2023.3 format - note the structure!)
exclude:
  - name: "All exclusions"
    paths:
      - build
      - dist
      - result
      - .nix-store
      - repos
      - mirrors
      - pinned-rocm
      - pinned
      - contracts
      - flake.lock
      - .venv
      - venv
      - __pycache__
      - .qodana
      - .git
      - .vscode
      - .idea

# Disable noisy inspections
disabledInspections:
  - PyPackageRequirements
  - PyInterpreterInspection
  - SpellCheckingInspection