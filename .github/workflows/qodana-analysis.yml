name: Qodana Code Analysis

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  qodana:
    name: Qodana Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Set up Nix
        uses: cachix/install-nix-action@v22
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Qodana
        uses: actions/cache@v3
        with:
          path: ~/.cache/qodana
          key: qodana-${{ runner.os }}-${{ hashFiles('qodana-global-configurations.yaml', '.qodana/**') }}
          restore-keys: |
            qodana-${{ runner.os }}-

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2023.3.0
        with:
          args: >
            --baseline,qodana.sarif.json
            --baseline-include-absent
            --config,qodana-global-configurations.yaml
            --source-directory,.
            --fail-threshold,0
            --report-dir,${{ runner.temp }}/qodana/results
            --cache-dir,${{ runner.temp }}/qodana/cache
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload Qodana SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana

      - name: Upload Qodana Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results/
          retention-days: 7

      - name: Comment PR with Qodana Results
        if: github.event_name == 'pull_request' && always()
        uses: dorny/test-reporter@v1
        with:
          name: Qodana Results
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          reporter: sarif
          fail-on-error: false