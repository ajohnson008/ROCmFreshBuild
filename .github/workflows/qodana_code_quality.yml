name: Qodana Python Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - '.qodana/**'
      - 'qodana.yaml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Run Qodana Python analysis
        uses: JetBrains/qodana-action@v2025.2
        with:
          linter: jetbrains/qodana-python:2025.3
          args: --skip-pull --fail-threshold 0  # Offline-safe
          project-dir: .
      
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/.qodana/results/qodana.sarif.json
        if: always()
      
      - name: Archive analysis results
        uses: actions/upload-artifact@v4
        with:
          name: qodana-python-report
          path: ${{ github.workspace }}/.qodana/results/
          retention-days: 7
        if: always()
