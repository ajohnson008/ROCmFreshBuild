name: Qodana Configuration Upload

on:
    push:
        branches: [ main, master, dev ]
        paths:
          - 'qodana-global-configurations.yaml'
          - '.qodana/**'
          - '.github/workflows/qodana-*.yml'
    pull_request:
        branches: [ main, master ]
        paths:
          - 'qodana-global-configurations.yaml'
          - '.qodana/**'
          - '.github/workflows/qodana-*.yml'
    workflow_dispatch:

jobs:
    upload-qodana-config:
        name: Upload Qodana Configuration
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Validate Qodana Configuration
              run: |
                  if [ ! -f qodana-global-configurations.yaml ]; then
                      echo "Error: qodana-global-configurations.yaml not found"
                      exit 1
                  fi
                  echo "Configuration file exists"

            - name: Run Qodana Configuration Uploader
              env:
                  QODANA_CONFIGURATIONS_TOKEN: ${{ secrets.QODANA_CONFIGURATIONS_TOKEN }}
                  QODANA_ENDPOINT: 'https://qodana.cloud'
              run: |
                  docker run --rm \
                    -v $(pwd):/workspace \
                    -w /workspace \
                    -e QODANA_CONFIGURATIONS_TOKEN=$QODANA_CONFIGURATIONS_TOKEN \
                    jetbrains/qodana-configuration-uploader:latest \
                    --global-configs-file qodana-global-configurations.yaml

            - name: Notify on Success
              if: success()
              run: |
                  echo "✅ Qodana configuration uploaded successfully"
                  echo "Configuration will be available at: https://qodana.cloud"