version: "1.0"
linter: jetbrains/qodana-python:2023.3
profile:
  name: qodana.recommended
include:
  - name: "Include Python source directories"
    paths:
      - lib
      - scripts
      - tools
      - agent_playbooks
      - "*.py"
exclude:
  - name: "Exclude build and vendor directories"
    paths:
      - build
      - dist
      - repos
      - mirrors
      - pinned
      - pinned-rocm
      - cache
      - result
      - contracts
      - runs
      - __pycache__
      - "*.egg-info"