version: "1.0"
linter: jetbrains/qodana-python:2023.3
profile:
  name: qodana.recommended
exclude:
  - name: "Exclude build and vendor directories"
    paths:
      - build
      - dist
      - repos
      - mirrors
      - pinned
      - pinned-rocm
      - cache
      - result
      - contracts
      - runs
      - __pycache__
      - ".pytest_cache"
      - ".venv"
      - "venv"
      - "node_modules"
      - ".git"
      - ".github"
      - ".idea"
      - ".vscode"