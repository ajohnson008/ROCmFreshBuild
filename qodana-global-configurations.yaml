# Qodana Global Configurations
# This file contains global configuration for Qodana code quality analysis

version: "1.0"

# Global inspections
inspections:
  - name: "Security"
    enabled: true
    severity: "ERROR"
  - name: "CodeSmell"
    enabled: true
    severity: "WARNING"

# Exclude patterns
exclude:
  - "**/node_modules/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/result/**"
  - "**/mirrors/**"
  - "**/pinned/**"
  - "**/runs/**"
  - "**/repos/**"

# Include patterns
include:
  - "**/*.py"
  - "**/*.sh"
  - "**/*.nix"
  - "**/*.md"