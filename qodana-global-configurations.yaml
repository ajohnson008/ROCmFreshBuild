# Qodana Global Configurations
# This file contains global configuration for Qodana code quality analysis

version: "1.0"

global:
  inspections:
    - name: "Security"
      enabled: true
      severity: "ERROR"
    - name: "CodeSmell"
      enabled: true
      severity: "WARNING"
  exclude:
    - "**/node_modules/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/result/**"
    - "**/mirrors/**"
    - "**/pinned/**"
    - "**/runs/**"
    - "**/repos/**"
  include:
    - "**/*.py"
    - "**/*.sh"
    - "**/*.nix"
    - "**/*.md"